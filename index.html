<title>MOHA Links | MOHAMED</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{

min-height:100vh;

font-family:Arial,sans-serif;

color:white;

text-align:center;

display:flex;

justify-content:center;

background:#050816;

overflow-x:hidden;

position:relative;

}

/* =========================
   BACKGROUND
========================= */

body::before{

content:"";

position:fixed;

inset:0;

background-image:

linear-gradient(
rgba(3,8,18,.45),
rgba(3,8,18,.65)
),

url("1786994704601.png");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

z-index:0;

}

/* =========================
   BLUE GLOW
========================= */

body::after{

content:"";

position:fixed;

width:500px;

height:500px;

background:#00c6ff;

filter:blur(160px);

opacity:.10;

border-radius:50%;

top:-180px;

left:-180px;

animation:glow 8s infinite alternate;

z-index:1;

}

@keyframes glow{

from{

transform:translate(0,0);

}

to{

transform:translate(180px,100px);

}

}

/* =========================
   CONTAINER
========================= */

.container{

width:100%;

max-width:560px;

padding:45px 18px;

position:relative;

z-index:2;

}

/* =========================
   LOGO
========================= */

.logo{

width:120px;

height:120px;

margin:auto;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:#000;

border:3px solid rgba(255,255,255,.9);

box-shadow:

0 0 20px #00c6ff,

0 0 60px rgba(0,198,255,.45);

animation:pulse 3s infinite;

}

.logo img{

width:100%;

height:100%;

object-fit:cover;

display:block;

}

@keyframes pulse{

0%,100%{

transform:scale(1);

box-shadow:

0 0 20px #00c6ff,

0 0 60px rgba(0,198,255,.35);

}

50%{

transform:scale(1.04);

box-shadow:

0 0 35px #00c6ff,

0 0 80px rgba(0,198,255,.55);

}

}

/* =========================
   NAME
========================= */

h1{

font-size:32px;

margin-top:22px;

letter-spacing:3px;

text-shadow:

0 3px 15px rgba(0,0,0,.8);

}

/* =========================
   SUBTITLE
========================= */

.subtitle{

color:#d1d5db;

margin-top:8px;

margin-bottom:20px;

font-size:15px;

text-shadow:

0 2px 8px rgba(0,0,0,.8);

}

/* =========================
   ACTION BUTTONS
========================= */

.actions{

display:flex;

gap:12px;

margin-bottom:18px;

}

.actions button{

flex:1;

height:52px;

border:1px solid rgba(0,198,255,.7);

border-radius:15px;

background:rgba(10,18,32,.82);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

.actions button:hover{

transform:translateY(-2px);

box-shadow:

0 0 18px rgba(0,198,255,.5);

border-color:#00c6ff;

}

/* =========================
   LINKS
========================= */

.links{

display:flex;

flex-direction:column;

gap:14px;

}

.link{

position:relative;

display:flex;

align-items:center;

justify-content:center;

height:62px;

text-decoration:none;

color:white;

background:rgba(10,18,32,.78);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

border:1px solid rgba(0,198,255,.65);

border-radius:17px;

font-size:18px;

font-weight:bold;

box-shadow:

0 8px 25px rgba(0,0,0,.35);

transition:.25s;

overflow:hidden;

}

.link::before{

content:"";

position:absolute;

inset:0;

background:

linear-gradient(

90deg,

transparent,

rgba(0,198,255,.18),

transparent

);

transform:translateX(-100%);

transition:.5s;

}

.link:hover::before{

transform:translateX(100%);

}

.link:hover{

transform:translateY(-3px) scale(1.01);

border-color:#00c6ff;

box-shadow:

0 0 20px rgba(0,198,255,.45),

0 10px 30px rgba(0,0,0,.5);

}

/* =========================
   ICONS
========================= */

.icon{

position:absolute;

right:20px;

font-size:24px;

}

.arrow{

position:absolute;

left:20px;

color:#00c6ff;

font-size:25px;

}

/* =========================
   ONLINE
========================= */

.online{

display:inline-flex;

align-items:center;

gap:7px;

margin-top:25px;

color:#d1d5db;

font-size:13px;

text-shadow:

0 2px 8px rgba(0,0,0,.8);

}

.dot{

width:8px;

height:8px;

background:#22c55e;

border-radius:50%;

box-shadow:

0 0 10px #22c55e;

}

/* =========================
   FOOTER
========================= */

.footer{

margin-top:25px;

color:#9ca3af;

font-size:13px;

text-shadow:

0 2px 8px rgba(0,0,0,.8);

}

/* =========================
   MOBILE
========================= */

@media(max-width:450px){

.container{

padding:35px 15px;

}

.logo{

width:105px;

height:105px;

}

h1{

font-size:27px;

}

.subtitle{

font-size:14px;

}

.link{

height:58px;

font-size:17px;

}

.actions button{

font-size:14px;

}

}

@media(max-width:350px){

width:95px;

height:95px;

}

h1{

font-size:24px;

}

.link{

font-size:16px;

}

}

</style>

</head>
