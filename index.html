<title>MOHA Links | MOHAMED</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
text-align:center;
display:flex;
justify-content:center;
background:#050816;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:500px;
height:500px;
background:#00c6ff;
filter:blur(150px);
opacity:.12;
border-radius:50%;
top:-180px;
left:-150px;
animation:move 8s infinite alternate;
}

body::after{
content:"";
position:fixed;
width:450px;
height:450px;
background:#0066ff;
filter:blur(150px);
opacity:.12;
border-radius:50%;
bottom:-200px;
right:-150px;
animation:move2 10s infinite alternate;
}

@keyframes move{
from{transform:translate(0,0)}
to{transform:translate(180px,100px)}
}

@keyframes move2{
from{transform:translate(0,0)}
to{transform:translate(-160px,-100px)}
}

.container{
width:100%;
max-width:560px;
padding:45px 18px;
position:relative;
z-index:2;
}

.logo{
width:110px;
height:110px;
margin:auto;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:bold;
letter-spacing:2px;

background:linear-gradient(135deg,#00c6ff,#0066ff);

border:3px solid rgba(255,255,255,.8);

box-shadow:
0 0 20px #00c6ff,
0 0 60px rgba(0,198,255,.45);

animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%,100%{
transform:scale(1);
box-shadow:0 0 20px #00c6ff,0 0 60px rgba(0,198,255,.35);
}
50%{
transform:scale(1.04);
box-shadow:0 0 35px #00c6ff,0 0 80px rgba(0,198,255,.55);
}
}

h1{
font-size:32px;
margin-top:22px;
letter-spacing:3px;
}

.subtitle{
color:#9ca3af;
margin-top:8px;
margin-bottom:30px;
font-size:15px;
}

.links{
display:flex;
flex-direction:column;
gap:14px;
}

.link{
position:relative;
display:flex;
align-items:center;
justify-content:center;

height:62px;

text-decoration:none;
color:white;

background:rgba(17,24,39,.82);

border:1px solid rgba(0,198,255,.55);

border-radius:17px;

font-size:18px;
font-weight:bold;

box-shadow:0 8px 25px rgba(0,0,0,.25);

transition:.25s;

overflow:hidden;
}

.link::before{
content:"";
position:absolute;
inset:0;

background:linear-gradient(
90deg,
transparent,
rgba(0,198,255,.18),
transparent
);

transform:translateX(-100%);
transition:.5s;
}

.link:hover::before{
transform:translateX(100%);
}

.link:hover{
transform:translateY(-3px) scale(1.01);

border-color:#00c6ff;

box-shadow:
0 0 20px rgba(0,198,255,.35),
0 10px 30px rgba(0,0,0,.35);
}

.icon{
position:absolute;
right:20px;
font-size:24px;
}

.arrow{
position:absolute;
left:20px;
color:#00c6ff;
font-size:20px;
}

.footer{
margin-top:35px;
color:#6b7280;
font-size:13px;
}

.online{
display:inline-flex;
align-items:center;
gap:7px;
margin-top:12px;
color:#9ca3af;
font-size:13px;
}

.dot{
width:8px;
height:8px;
background:#22c55e;
border-radius:50%;
box-shadow:0 0 10px #22c55e;
}

@media(max-width:450px){

.container{
padding:35px 15px;
}

.logo{
width:95px;
height:95px;
font-size:28px;
}

h1{
font-size:27px;
}

.link{
height:58px;
font-size:17px;
}
}
</style>
</head>
